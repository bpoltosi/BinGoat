name: Native C server

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "backend/**"
      - "bingo_engine.c"
      - "bingo_engine.h"
      - "package.json"
      - "bun.lock"
      - "vite.config.js"
      - "README.md"
      - "tests/run-server-tests.*"
      - "tests/run-vite-proxy-test.sh"
      - ".github/workflows/c-server.yml"
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "backend/**"
      - "bingo_engine.c"
      - "bingo_engine.h"
      - "package.json"
      - "bun.lock"
      - "vite.config.js"
      - "README.md"
      - "tests/run-server-tests.*"
      - "tests/run-vite-proxy-test.sh"
      - ".github/workflows/c-server.yml"
  workflow_dispatch:

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install frontend dependencies
        run: npm install --no-package-lock
      - name: Build production frontend
        run: npm run build
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: HTTP smoke tests
        run: sh tests/run-server-tests.sh
      - name: Verify Vite proxy reaches native C API
        run: sh tests/run-vite-proxy-test.sh

  windows-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
      - name: Build with MinGW-w64
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: HTTP smoke tests
        shell: pwsh
        run: ./tests/run-server-tests.ps1
