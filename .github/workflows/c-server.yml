name: Native C server

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "backend/**"
      - "bingo_engine.c"
      - "bingo_engine.h"
      - "tests/run-server-tests.*"
      - ".github/workflows/c-server.yml"
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "backend/**"
      - "bingo_engine.c"
      - "bingo_engine.h"
      - "tests/run-server-tests.*"
      - ".github/workflows/c-server.yml"
  workflow_dispatch:

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: HTTP smoke tests
        run: sh tests/run-server-tests.sh

  windows-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
      - name: Build with MinGW-w64
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: HTTP smoke tests
        shell: pwsh
        run: ./tests/run-server-tests.ps1
