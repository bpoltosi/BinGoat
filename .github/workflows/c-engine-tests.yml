name: C engine characterization

on:
  pull_request:
    paths:
      - "TrabalhoBingo.c"
      - "tests/**"
      - ".github/workflows/c-engine-tests.yml"
  push:
    branches:
      - main
    paths:
      - "TrabalhoBingo.c"
      - "tests/**"
      - ".github/workflows/c-engine-tests.yml"
  workflow_dispatch:

jobs:
  characterization:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux / GCC
            os: ubuntu-latest
          - platform: Windows / MinGW-w64
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Run GCC characterization tests
        if: runner.os == 'Linux'
        run: sh tests/run-tests.sh

      - name: Run MinGW-w64 characterization tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/run-tests.ps1
